name: diagnostico-contaminacao-qt-linux

on:
  push:
    branches:
      - fix/macos-global-hotkey-crash
  workflow_dispatch:

jobs:
  isolar-interferencia:
    name: "Linux Qt - ${{ matrix.grupo }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - grupo: primeira-metade
            modulos: >-
              tests/test_30_bugs.py
              tests/test_aparencia.py
              tests/test_app.py
              tests/test_arquitetura.py
          - grupo: segunda-metade
            modulos: >-
              tests/test_atividade.py
              tests/test_auditoria_30.py
              tests/test_bolinha.py
              tests/test_brincadeira.py
          - grupo: todos-anteriores
            modulos: >-
              tests/test_30_bugs.py
              tests/test_aparencia.py
              tests/test_app.py
              tests/test_arquitetura.py
              tests/test_atividade.py
              tests/test_auditoria_30.py
              tests/test_bolinha.py
              tests/test_brincadeira.py
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências nativas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1

      - name: Instalar dependências Python
        run: python -m pip install -r requirements.txt pytest==8.4.2 pyflakes==4.1.0

      - name: Registrar versões
        run: |
          python -c "import PySide6, shiboken6; print('PySide6:', PySide6.__version__, 'Shiboken:', shiboken6.__version__)"

      - name: Executar módulos anteriores e 100 cenários
        env:
          MODULOS: ${{ matrix.modulos }}
        run: |
          echo "Grupo: ${{ matrix.grupo }}"
          echo "Módulos anteriores: $MODULOS"
          python -X faulthandler -m pytest -vv --setup-show --tb=short $MODULOS tests/test_cantinho_cenarios.py
